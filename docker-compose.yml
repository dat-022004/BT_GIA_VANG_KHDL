version: '3.8'

services:
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - '8080:8080'
      - '7077:7077'
    volumes:
      - ./data:/opt/spark-data

  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--webui-port", "8081", "--cores", "2", "--memory", "2G"]
    volumes:
      - ./data:/opt/spark-data

  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--webui-port", "8082", "--cores", "2", "--memory", "2G"]
    volumes:
      - ./data:/opt/spark-data

  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: jupyter
    hostname: jupyter
    depends_on:
      - spark-master
    ports:
      - '8888:8888'
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=vang2024
      - SPARK_MASTER=spark://spark-master:7077
    volumes:
      - ./data:/opt/spark-data
      - ./thuyettrinh:/home/jovyan/work
    command: >
      start-notebook.sh
      --NotebookApp.token='vang2026'
      --NotebookApp.ip='0.0.0.0'
